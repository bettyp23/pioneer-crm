# Isolated worker for the CRM mount. Deploying this file publishes ONLY these
# four routes. It does not create a workers.dev hostname and it does not name
# any other worker (leave victoryspinal and email DNS alone).
#
# Rollback: `npx wrangler delete pioneer-login-proxy` removes this worker and
# its routes. Pages then serves /login again (404). Do not delete other workers.

name = "pioneer-login-proxy"
main = "src/index.js"
compatibility_date = "2026-11-07"
workers_dev = false
account_id = "f513ddbf99c0286386bb98cac4d227b4"

[vars]
# CRM production origin. Must stay the vercel.app host. Pointing this at
# https://pioneerdigitalai.com makes the worker call itself.
UPSTREAM_ORIGIN = "https://pioneer-crm-two.vercel.app"

[[routes]]
pattern = "pioneerdigitalai.com/login"
zone_name = "pioneerdigitalai.com"

[[routes]]
pattern = "pioneerdigitalai.com/login/*"
zone_name = "pioneerdigitalai.com"

[[routes]]
pattern = "www.pioneerdigitalai.com/login"
zone_name = "pioneerdigitalai.com"

[[routes]]
pattern = "www.pioneerdigitalai.com/login/*"
zone_name = "pioneerdigitalai.com"
